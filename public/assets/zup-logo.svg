<svg viewBox="0 0 480 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Speed lines (left of Z) -->
  <rect x="8"  y="38" width="62" height="13" rx="6.5" fill="#F97316"/>
  <rect x="4"  y="60" width="52" height="12" rx="6"   fill="#F97316"/>
  <rect x="10" y="81" width="44" height="11" rx="5.5" fill="#F97316"/>

  <!-- Z / Cart icon -->
  <!-- Top horizontal bar -->
  <rect x="78" y="18" width="100" height="24" rx="12" fill="#F97316"/>
  <!-- Diagonal stroke of Z -->
  <line x1="172" y1="32" x2="85" y2="108" stroke="#F97316" stroke-width="22" stroke-linecap="round"/>
  <!-- Bottom horizontal bar -->
  <rect x="72" y="98" width="108" height="24" rx="12" fill="#F97316"/>
  <!-- Cart wheels -->
  <circle cx="96"  cy="132" r="11" fill="#F97316"/>
  <circle cx="148" cy="132" r="11" fill="#F97316"/>

  <!-- "uppi" — bold rounded font -->
  <text
    x="205" y="118"
    font-family="'Nunito', 'Poppins', 'Quicksand', Arial Rounded MT Bold, Arial, sans-serif"
    font-weight="900"
    font-size="108"
    fill="#1a1a2e"
    letter-spacing="-3"
  >uppi</text>

  <!-- Override the "i" dot to orange -->
  <!-- The dot of "i" sits approximately at x=448, y=20 -->
  <!-- We cover it with a white rect then draw orange circle -->
  <rect x="436" y="4" width="34" height="30" fill="white"/>
  <circle cx="453" cy="18" r="13" fill="#F97316"/>
</svg>
