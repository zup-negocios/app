  <circle cx="64" cy="64" r="6" fill="#F97316"/>

  <!-- "uppi" text -->
  <text x="84" y="60" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="50" fill="#111111" letter-spacing="-2">uppi</text>
</svg>
