<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <!-- Speed lines left -->
  <line x1="1" y1="26" x2="18" y2="26" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="4" y1="36" x2="21" y2="36" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="1" y1="46" x2="15" y2="46" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cart / Z icon -->
  <!-- Top horizontal bar -->
  <path d="M24 20 L62 20" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
  <!-- Diagonal Z -->
  <path d="M62 20 L38 54" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom horizontal bar (cart base) -->
